# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The discrete Hudson theorem"
  description: >-
    A machine-checked proof of Gross's discrete Hudson theorem: for odd d, a pure state of n
    qudits has a non-negative Wigner function if and only if it is a stabilizer state. Every odd
    d is covered, including composite d, and every n. The definitions follow Gross's Section II:
    the Weyl operators w(p, q) with the symmetric phase convention, the phase point operators
    A(a) = d^(-n) sum_b omega([a, b]) w(b), the Wigner function W(a) = d^(-n) <psi|A(a)|psi>,
    and a stabilizer state as a common eigenvector of the Weyl operators of an isotropic subgroup
    of phase space with d^n elements. Also proved: the Wigner function is real, and equals the
    closed form d^(-n) sum_xi omega(p . xi) conj(psi(q + xi/2)) psi(q - xi/2) (Gross, Theorem 6).
    The proof
    does not follow Gross's Section III. For a pure state the Wigner values sum to 1, their
    squares sum to d^(-n), and none exceeds d^(-n), so non-negative values are 0 or d^(-n); the
    points where W = d^(-n) give, through products of phase point operators, a maximal isotropic
    group of Weyl operators fixing the state. The converse is a character sum. Two concrete
    controls show both sides of the equivalence are attained.
  authors:
    - "Zayn Blore"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Zayn Blore"

repository:
  role: "substantive-development"

classification:
  arxiv: ["quant-ph", "math-ph"]
  msc2020: ["81S30", "81P45", "81P68"]

sources:
  - title: "Hudson's theorem for finite-dimensional quantum systems"
    authors:
      - "D. Gross"
    id: "https://doi.org/10.1063/1.2393152"
    type: "paper"
    location: "J. Math. Phys. 47 (2006), no. 12, 122107; arXiv:quant-ph/0602001."
    relationship: "formalizes"
    note: >-
      Theorem 2 (Discrete Hudson's Theorem). Definitions from Section II: Weyl operators
      (eqs. (3), (8)), the symplectic form (eqs. (5), (6)), phase point operators and the Wigner
      function (Definition 5, eq. (15)), stabilizer states (Lemma 8, with Corollary 26 for the
      size of a maximally isotropic subgroup). Statement and definitions were taken from the
      arXiv version (v3). The proof here does not follow Section III (a discrete Bochner
      theorem, balanced sets, Clifford covariance and a similarity lemma); see the project
      description. The converse direction is Gross's Lemma 9, proved here by a character sum.
    author_endorsement: "n/a"

