status:
  scope: >-
    Gross's Theorem 2 for every odd d and every number of qudits n: for a non-zero vector, the
    Wigner function is non-negative everywhere if and only if the vector is a stabilizer state;
    plus the reality of the Wigner function and its closed form. Not covered: even d, including
    qubits, which Gross's theorem does not address; mixed states; the Clifford-group results; the
    uniqueness of the Wigner function and the prime-power counting in Gross's other sections,
    and the explicit quadratic-phase form of stabilizer states.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code"
  notes: >-
    I drafted the Lean with Claude Code, on 25 November 2026. I chose the theorem, the statement
    (Gross's own definitions, every odd d including composite d, the full equivalence) and the
    proof route through phase point operators, and I checked the result.

fidelity:
  divergences: >-
    Written directly in Mathlib. A vector is a function on the computational basis
    (Fin n -> ZMod d); operators act on such functions. omega is ZMod.stdAddChar,
    omega(t) = exp(2 pi i t / d), and 2^(-1) is the inverse of 2 in ZMod d. The Wigner function
    is defined for any vector as d^(-n) <psi|A(a)|psi>, which is Gross's W for a unit vector and
    ||psi||^2 times it in general; the sign, and so the theorem, is unaffected, and the theorem
    assumes only psi non-zero. Non-negativity is stated in Mathlib's ComplexOrder (0 <= z means
    z is real and non-negative); wigner_im shows the Wigner function is real, so this is
    ordinary non-negativity. A stabilizer state is a common eigenvector of the w(m), m in M, for
    an isotropic additive subgroup M with d^n elements; Gross's Lemma 8 fixes the eigenvalues as
    omega([v, m])^(-1), which for an isotropic M is the same condition, and his Corollary 26
    shows that isotropic subgroups with d^n elements are exactly the maximally isotropic ones.

review:
  status: "unreviewed"
  notes: >-
    The proof development has no sorry, admit or native_decide; the sorry in Challenge.lean is
    Comparator's placeholder, and audit/Control.lean has one deliberate sorry, placed last, to
    show that the axiom audit catches it. audit/Axioms.lean enforces with #guard_msgs that the
    three theorems and both directions of the main argument use only propext, Classical.choice
    and Quot.sound. audit/Control.lean proves that the basis vector |0...0> is a stabilizer
    state for every d and n, and that for one qutrit the Norrell state |1> - |2> has
    W(0, 0) = -2/3 (-1/3 once normalised), so is not one. Lake's comparator was run locally on Windows, unsandboxed
    (--inadvisably-no-sandbox, with explicit paths to the nanoda and con-ron binaries), on
    25 November 2026: the statements match and con-ron (18,928 declarations), nanoda and Lean's
    kernel accept the proof. An unsandboxed run is not the trusted check; the sandboxed Linux
    run happens in CI after a push.

alignment:
  namespace: "DiscreteHudson"
  statements:
    - source: "Gross, Theorem 2 (Discrete Hudson's Theorem): for odd d, the Wigner function of a state vector is non-negative if and only if it is a stabilizer state"
      lean: "DiscreteHudson.discrete_hudson"
      module: "Solution"
      status: "proved"
    - source: "The Wigner function of a pure state is real (Gross, Theorem 6.1)"
      lean: "DiscreteHudson.wigner_im"
      module: "Solution"
      status: "proved"
    - source: "The Wigner function of a pure state in closed form (Gross, Theorem 6.2)"
      lean: "DiscreteHudson.wigner_eq"
      module: "Solution"
      status: "proved"

