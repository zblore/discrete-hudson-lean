# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The discrete Hudson theorem"
  description: >-
    A machine-checked proof of Gross's discrete Hudson theorem: for odd d, a pure state of n
    qudits has a non-negative Wigner function if and only if it is a stabilizer state. Every odd
    d is covered, including composite d, and every n. The definitions follow Gross's Section II:
    the Weyl operators w(p, q) with the symmetric phase convention, the phase point operators
    A(a) = d^(-n) sum_b omega([a, b]) w(b), the Wigner function W(a) = d^(-n) <psi|A(a)|psi>,
    and a stabilizer state as a common eigenvector of the Weyl operators of an isotropic subgroup
    of phase space with d^n elements. Also proved: the Wigner function is real, and equals the
    closed form d^(-n) sum_xi omega(p . xi) conj(psi(q + xi/2)) psi(q - xi/2) (Gross, Theorem 6.2,
    after xi -> -xi), and the equivalence of the definition with Gross's Lemma 8 form, where the
    eigenvalues are omega([v, m])^(-1). The proof does not follow Gross's Section III; it follows
    the route of Gross, Nezami and Walter (2021), Section 8.1. For a pure state the Wigner values
    sum to 1, their squares sum to d^(-n), and none exceeds d^(-n), so non-negative values are 0
    or d^(-n); at the d^n points where W = d^(-n) the phase point operators fix the state, and
    products of two of them give a maximal isotropic group of Weyl operators of which the state
    is a common eigenvector. The converse is a character sum. Controls show both sides of the
    equivalence are attained, including at the composite dimension d = 9.
  authors:
    - "Zayn Blore"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Zayn Blore"

repository:
  role: "substantive-development"

classification:
  arxiv: ["quant-ph", "math-ph"]
  msc2020: ["81S30", "81P45", "81P68"]

sources:
  - title: "Hudson's theorem for finite-dimensional quantum systems"
    authors:
      - "D. Gross"
    id: "https://doi.org/10.1063/1.2393152"
    type: "paper"
    location: "J. Math. Phys. 47 (2006), no. 12, 122107; arXiv:quant-ph/0602001."
    relationship: "formalizes"
    note: >-
      Theorem 2 (Discrete Hudson's Theorem). Definitions from Section II: Weyl operators
      (eqs. (3), (8)), the symplectic form (eqs. (5), (6)), phase point operators and the Wigner
      function (Definition 5, eq. (15)), stabilizer states (Lemma 8; Gross defines a maximally
      isotropic subspace as one with d^n elements, Section II D). Statement and definitions were taken from the
      arXiv version (v3). The proof here does not follow Section III (a discrete Bochner
      theorem, balanced sets, Clifford covariance and a similarity lemma); see the next source.
      The converse direction is Gross's Lemma 9, proved here by a character sum.
    author_endorsement: "n/a"
  - title: "Schur-Weyl Duality for the Clifford Group with Applications: Property Testing, a Robust Hudson Theorem, and de Finetti Representations"
    authors:
      - "D. Gross"
      - "S. Nezami"
      - "M. Walter"
    id: "https://doi.org/10.1007/s00220-021-04118-7"
    type: "paper"
    location: "Commun. Math. Phys. 385 (2021), no. 3, 1325-1393; arXiv:1712.08628."
    relationship: "background"
    note: >-
      Section 8.1 (Exact Hudson theorem) gives a short proof of Theorem 8.1, the discrete Hudson
      theorem, by the route used here: purity forces a non-negative Wigner function to be
      d^(-n) on a set of d^n points, where the phase point operators fix the state, and
      products of phase point operators give isotropy. The author worked the route out before
      reading the paper and learned of it from a review. Differences: they use products of three
      phase point operators to show the set is an affine isotropic subspace; here products of
      two give a subgroup of Weyl operators with the state as common eigenvector, bounded above
      by the sum of |<psi|w(v)|psi>|^2 over phase space.
    author_endorsement: "n/a"

